<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inha Mobil | RRT / TTC</title><link rel="icon" sizes="1024x1024" type="image/png" href="./inha-mobil-logo-579cbb6f.png"><link rel="stylesheet" href="./style.css?v=f59ebfe268b3"><script src="./avoidance.js?v=8df61ba663ea" defer></script><link rel="stylesheet" href="./polish.css?v=1ce57c5d31dd">
</head>
<body>
<header class="topbar"><a class="brand brand-home" href="/demo/" aria-label="Inha Mobil 메인 새로고침"><img class="brand-image" src="./inha-mobil-logo-579cbb6f.png" alt="" width="52" height="52"><span>Inha <strong>Mobil</strong></span></a><nav class="top-nav" aria-label="관제 메뉴"><a href="/demo/">캠퍼스 관제</a><a href="./avoidance.html" class="active">RRT / TTC</a></nav></header>
<main class="lab live-lab">
<section class="lab-card lab-stage"><div class="section-title"><h1>RRT / TTC</h1><span id="lab-mode-label" class="mini-label">정적 장애물 우회</span></div><svg id="avoidance-map" role="img" aria-label="시간에 따라 이동하는 차량과 장애물, RRT 경로 및 TTC 예측" viewBox="-6 -15 12 18"></svg><div class="lab-playback"><button id="lab-play" class="primary-button">재생</button><button id="lab-reset">처음으로</button><output id="lab-clock">0.00초</output><label for="lab-rate">배속</label><select id="lab-rate"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></div><input id="lab-timeline" type="range" min="0" max="30" step="0.05" value="0" aria-label="실험 시간 이동"><p class="lab-note">합성 센서 / 20Hz 운동 모형. Unity·실제 관제 차량과 미연결.</p></section>
<section class="lab-card lab-controls"><h2>실험 조건</h2><label for="lab-mode">장애물</label><select id="lab-mode"><option value="static">정적 장애물 / RRT 우회</option><option value="crossing">횡단 보행자 / TTC 정지</option></select><label for="lab-x">좌우 위치 <output id="value-x">0m</output></label><input id="lab-x" type="range" min="-3" max="3" value="0" step="0.1"><label for="lab-y">전방 거리 <output id="value-y">6m</output></label><input id="lab-y" type="range" min="1" max="10" value="6" step="0.1"><label for="lab-speed">목표 속도 <output id="value-speed">7.2km/h</output></label><input id="lab-speed" type="range" min="0" max="8.333333333333334" value="2" step="0.1"><label class="checks"><input id="lab-stale" type="checkbox">센서 관측 만료</label><button id="lab-run">조건 적용 / 다시 생성</button><div id="lab-status" class="lab-status" aria-live="polite">계산 중</div><p id="lab-message" role="status"></p><details class="detail-panel"><summary>센서 / 경로 상세</summary><label class="checks"><input id="lab-tree" type="checkbox">RRT 탐색 트리</label><div id="lab-details" class="lab-note"></div><p class="lab-note">파랑: RRT 경로 / 초록: 차량 궤적 / 주황: 장애물 여유 / 빨강: 2초 예측<br>횡단 보행자는 우회 대신 감속·정지 후 안전 여유 1초를 확인해 재출발합니다.</p></details></section>
</main></body></html>
